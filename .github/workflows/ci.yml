name: ci

on:
  pull_request:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  gates:
    name: repo gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check -r requirements.txt -r scripts/data/requirements.txt
      - name: Run gates
        env:
          PYTHONPATH: scripts
        run: |
          set -o pipefail
          python -m gates.run | tee "$RUNNER_TEMP/gates.txt"
      - name: Validate collection provenance
        env:
          PYTHONPATH: scripts
        run: |
          set -o pipefail
          python -m router.collection_provenance --discover | tee "$RUNNER_TEMP/provenance.txt"
      - name: Run tests
        env:
          PYTHONPATH: scripts
        run: python -m pytest tests -rs --junitxml="$RUNNER_TEMP/pytest.xml"
      - name: Record public counts
        if: always()
        env:
          PYTHONPATH: scripts
        run: python -m ci.public_summary --gates "$RUNNER_TEMP/gates.txt" --provenance "$RUNNER_TEMP/provenance.txt" --junit "$RUNNER_TEMP/pytest.xml"
