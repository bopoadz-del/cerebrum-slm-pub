name: ci

on:
  pull_request:
  push:
    branches:
      - "**"

permissions:
  contents: read

jobs:
  gates:
    name: repo gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Install test runner
        run: python -m pip install --disable-pip-version-check -r requirements.txt -r scripts/data/requirements.txt
      - name: Run gates
        env:
          PYTHONPATH: scripts
        run: python -m gates.run
      - name: Validate collection provenance
        env:
          PYTHONPATH: scripts
        run: |
          args=(
            data/router/additions_thin_v9.jsonl
            data/router/additions_thin_v9b.jsonl
            data/router/additions_thin_v9c.jsonl
            data/router/additions_thin_v9f.jsonl
            data/router/additions_thin_d.jsonl
            data/router/additions_change_request_v9.jsonl
          )
          # Owner additions are not in the tree. Pass external paths with
          # SLM_OWNER_ADDITIONS (space-separated). A missing path fails the check.
          if [ -n "${SLM_OWNER_ADDITIONS:-}" ]; then
            # shellcheck disable=SC2206
            extra=(${SLM_OWNER_ADDITIONS})
            args+=("${extra[@]}")
          fi
          python -m router.collection_provenance "${args[@]}"
      - name: Run tests
        env:
          PYTHONPATH: scripts
        run: python -m pytest tests
